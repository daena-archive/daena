[package]
name = "daena-atlas"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
name = "daena_atlas"
path = "src/lib.rs"

[dependencies]
daena-physical = { path = "../daena-physical-spike" }
png = "0.17.16"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "atlas-map"
path = "src/main.rs"
