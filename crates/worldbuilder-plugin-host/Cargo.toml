[package]
name = "worldbuilder-plugin-host"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
semver = "1"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
wasmtime = "27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worldbuilder-plugin-api = { path = "../worldbuilder-plugin-api" }

[dev-dependencies]
wat = "1"
