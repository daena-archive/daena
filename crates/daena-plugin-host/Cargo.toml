[package]
name = "daena-plugin-host"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
semver = "1"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
wasmtime = "27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
daena-plugin-api = { path = "../daena-plugin-api" }

[build-dependencies]
wat = "1"

[dev-dependencies]
wat = "1"
