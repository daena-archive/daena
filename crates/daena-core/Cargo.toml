[package]
name = "daena-core"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"

[dependencies]
daena-physical = { path = "../daena-physical-spike" }
daena-atlas = { path = "../daena-atlas" }
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
png = "0.17.16"
jpeg-decoder = "0.3"
roxmltree = "0.20"
