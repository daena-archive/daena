[package]
name = "daena"
version = "0.1.0"
build = "build.rs"
license = "Apache-2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "daena_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
daena-physical = { path = "../crates/daena-physical-spike" }
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "stream"] }
infer = "0.19"
tokio = { version = "1", features = ["macros", "time"] }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
daena-core = { path = "../crates/daena-core" }
daena-atlas = { path = "../crates/daena-atlas" }
daena-ai = { path = "../crates/daena-ai" }
daena-plugin-api = { path = "../crates/daena-plugin-api" }
daena-plugin-host = { path = "../crates/daena-plugin-host" }
