[package]
name = "daena-physical"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "physical-map"

[lib]
name = "daena_physical"
path = "src/lib.rs"

[dependencies]
daena-worldgen = { path = "../daena-worldgen" }
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "physical-map"
path = "src/main.rs"

[[bin]]
name = "epoch-profile"
path = "src/bin/epoch_profile.rs"

