[package]
name = "daena-plugin-api"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8.22", optional = true }

[features]
default = []
gen = ["dep:schemars"]

[[bin]]
name = "gen-contract"
path = "src/bin/gen-contract.rs"
required-features = ["gen"]
