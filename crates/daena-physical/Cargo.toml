[package]
name = "daena-physical"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "daena_physical"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }

[[bin]]
name = "physical-map"
path = "src/main.rs"

[[bin]]
name = "climate-profile"
path = "src/bin/climate_profile.rs"

[profile.profiling]
inherits = "release"
debug = 2
