[package]
name = "daena-plugin-api-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
daena-plugin-api = { path = ".." }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "parse_manifest"
path = "fuzz_targets/parse_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_rpc_request"
path = "fuzz_targets/parse_rpc_request.rs"
test = false
doc = false
bench = false
